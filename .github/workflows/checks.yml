# Builds the firmware (which also builds the web app from web/) and runs the unit tests on every
# pull request and every push to master.
name: Checks

on:
  pull_request:
  push:
    branches: [master]

# Only reads the code; nothing in here needs to write to the repository
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build script tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Web app tests
        run: node --test "web/tests/*.test.js"

      # Host tests for the hardware-independent libraries (lib/History)
      - name: Firmware unit tests
        run: pio test -e native

      # tools/build_web.py runs as a pre-build step and fails the build when the gzipped page
      # grows beyond its size limit
      - name: Build firmware
        run: pio run
