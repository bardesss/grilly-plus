openapi: '3.1.1'
info:
  title: Grilly+
  version: '26.11.22.3'
  description: The local Grilly+ api

externalDocs:
  url: https://github.com/bardesss/grilly-plus
  description: Git repository

servers:
  - url: http://{grilly-plus-ip}/api
    variables:
      grilly-plus-ip:
        default: 192.168.200.10
        description: Your Grilly+ ip address

tags:
  - name: grill
    description: Grill overview with current status and temperatures
  - name: probes
    description: Detailed probe data and settings
  - name: settings
    description: Settings management
  - name: utility
    description: Utility api calls

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username "admin" with the configured admin_password. Only checked when an admin password is set.
  responses:
    '400':
      description: >-
        The body is missing, isn't valid json, or a field is invalid. Nothing was changed: the whole
        body is checked before anything is applied. The error names the field.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                examples:
                  - empty body
                  - Could not deserialize json
                  - Probes should be a json array
                  - "Probe 2: reference_kohm and reference_beta should be > 0 for a custom probe"
                  - beep_volume should be a number
    '415':
      description: Content-Type was not application/json
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Content-Type should be application/json"
  schemas:
    Grill:
      type: object
      properties:
        name:
          type: string
          example: Grilly+
          description: The chosen grill name
        unique_id:
          type: string
          format: uuid
          example: 12abc3de-4567-89f0-a123-456b789012c3
          description: The unique id in UUIDv4 format
        firmware_version:
          type: string
          example: 25.03.01
          description: The current firmware version in CalVer
        hostname:
          type: string
          example: grilly-plus-43c62ed2.local
          description: >-
            The grill's mDNS address, reachable from apps and browsers that support .local names.
            Built from the first 8 hex characters of unique_id and fixed for the life of the device.
        battery_percentage:
          type: integer
          example: 95
          description: The current - estimated - battery %
        battery_charging:
          type: boolean
          example: true
          description: If the battery is charging
        battery_millivolts:
          type: integer
          example: 3950
          description: The battery cell voltage in millivolts. 0 when the fuel gauge could not be read.
        last_reset_reason:
          type: string
          example: software
          description: >-
            Why the device last (re)started, read from esp_reset_reason() once at boot.
          enum:
            - power_on
            - software
            - panic
            - interrupt_watchdog
            - task_watchdog
            - watchdog
            - deep_sleep_wake
            - brownout
            - external
            - unknown
        last_off_reason:
          type: string
          example: update
          description: >-
            Why the device was last switched off or restarted deliberately, persisted across the
            power-off. Empty string when unknown, for example after the very first boot.
          enum:
            - button
            - factory_reset
            - update
            - low_battery
            - ""
        clock_known:
          type: boolean
          example: true
          description: True once the grill knows the time, from the internet (NTP) or from POST /time.
        resumed_off_s:
          type: integer
          example: 1380
          description: >-
            Whether this start carried on a cook saved before the restart: -1 = it didn't, -2 = it did
            but how long the grill was off is unknown, otherwise the seconds it was off.
        wifi_connected:
          type: boolean
          example: true
          description: If the grill is connected to a wifi network
        wifi_ssid:
          type: string
          example: my-home-wifi
          description: The name of the wifi network that the grill is connected to
        wifi_signal:
          type: integer
          example: -61
          description: The wifi signal expressed in dbm. The closer to 0 the better.
        wifi_ip:
          type: string
          example: 192.168.0.10
          description: The wifi ip when connected to your network
        local_ap_ssid:
          type: string
          example: GrillyPlus_A1B2C3
          description: The name of the grill's own hotspot, which is always on
        local_ap_ip:
          type: string
          example: 192.168.200.10
          description: The grill's address on its own hotspot
        temperature_unit:
          type: string
          description: The temperature_unit that is used
          example: celcius
          default: celcius
          enum:
            - celcius
            - fahrenheit
        alarm_sounding:
          type: boolean
          example: false
          description: True while a probe alarm is actively beeping. Mute it with POST /alarm/mute or over MQTT.
        update_available:
          type: string
          example: ""
          description: Version of a newer GitHub release found by the last update check, empty when there is none. See GET /update/latest.
        timers:
          type: array
          description: The running and finished timers, at most 6. They live in the grill's memory, a restart clears them.
          items:
            $ref: '#/components/schemas/Timer'
        alarm_timers:
          type: integer
          example: 0
          description: Bitmask of the timers (by their position in `timers`) that caused the sounding alarm, like `alarm` per probe.
        probes:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            properties:
              probe_id:
                type: integer
                description: The number of the probe
              name:
                type: string
                example: Probe 1
                description: The probe name
              temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The temperature in Celcius/Fahrenheit
              minimum_temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The minimum temperature in Celcius/Fahrenheit according to the settings. Used for temperature ranges. Above 0 the probe is in range mode and alarms when the temperature leaves minimum..target. 0 or below means target mode, which alarms once when the target is reached.
                examples:
                  - 30.00
                  - 25.5
              target_temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The target temperature in Celcius/Fahrenheit
                examples:
                  - 30.00
                  - 25.5
              connected:
                type: boolean
                description: Is the probe connected
              connected_seconds:
                type: integer
                description: Seconds since the probe was connected, 0 when it is not connected
              alarm:
                type: boolean
                description: True while this probe is one of the causes of a sounding alarm_sounding
              eta_seconds:
                type: integer
                readOnly: true
                description: >-
                  Seconds until the target temperature at the current rate. -1 when unknown: not in
                  target mode, not rising by at least 0.05 °C per minute, less than 3 minutes of
                  readings, target reached, or more than 24 hours away.
              stalled:
                type: boolean
                readOnly: true
                description: >-
                  In target mode, true while the probe is in the stall: the last 20 minutes stayed
                  within 1.5 °C, between 60 and 80 °C, with the target at least 5 °C higher.
              lid_open:
                type: boolean
                readOnly: true
                description: >-
                  In range mode, true after a sharp drop (8 °C within a minute, like opening the lid)
                  until the temperature is back within 2 °C or lid_pause_minutes are over. The "too
                  low" alarm waits meanwhile.
              type_icon:
                $ref: '#/components/schemas/TypeIcon'
              rest_minutes:
                type: integer
                example: 60
                description: Minutes of the rest timer that starts when a probe in target mode reaches its target, 0 is off.
              next_step:
                type:
                  - object
                  - "null"
                readOnly: true
                description: >-
                  The first step that isn't done or ignored, null for none or outside target mode. The full
                  list is in GET /probes (it doesn't fit in this status).
                properties:
                  action:
                    type: string
                    example: Wrap
                  temperature:
                    type: integer
                    example: 74
              step_alert:
                type: integer
                readOnly: true
                example: -1
                description: Index of the step that fired in the last 15 minutes (until a mute or the target or steps change), -1 for none.
              step_alert_action:
                type: string
                readOnly: true
                example: ""
                description: The action of that step ("Wrap"), "" for none. The app shows "Wrap now".
            example:
              probe_id: 1
              name: Ambient Probe
              temperature: 23.71832
              minimum_temperature: null
              target_temperature: 23.71832
              connected: true
              eta_seconds: -1
              stalled: false
              lid_open: false

    Timer:
      type: object
      properties:
        id:
          type: integer
          example: 3
          description: 1 to 255, to stop it with POST /timers/cancel
        name:
          type: string
          example: Flip the ribs
          maxLength: 24
        remaining_s:
          type: integer
          example: 754
          description: Seconds left, 0 once it ran out
        length_s:
          type: integer
          example: 1200
        done:
          type: boolean
          example: false
          description: It ran out. It stays until the alarm is muted, the button is pressed, it is stopped, or 10 minutes passed.
        probe:
          type: integer
          example: 0
          description: 0 for a timer of its own, 1-8 for the rest timer of that probe
    Probe:
      type: object
      properties:
        probe_id:
          type: integer
          description: The number of the probe
          examples:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
        name:
          type: string
          examples:
            - Probe 1
            - Ambient Probe
            - Pork shoulder
          description: The probe name
        temperature:
          type:
            - "number"
            - "null"
          format: float
          readOnly: true
          description: The temperature in Celcius/Fahrenheit according to the settings.
          examples:
            - 25.101
            - 27.101
            - 150.33
        minimum_temperature:
          type:
            - "number"
            - "null"
          format: float
          description: The minimum temperature in Celcius/Fahrenheit according to the settings. Used for temperature ranges. Above 0 the probe is in range mode and alarms when the temperature leaves minimum..target. 0 or below means target mode, which alarms once when the target is reached.
          default: 0
          examples:
            - 25.50
            - 120
        target_temperature:
          type:
            - "number"
            - "null"
          format: float
          description: The target temperature in Celcius/Fahrenheit according to the settings.
          default: 0
          examples:
            - 25.50
            - 120
        connected:
          type: boolean
          description: Is the probe connected
          readOnly: true
        probe_type:
          type: string
          description: >
            The probe type connected to the grilleye. There are several built-in probe types. If
            you have the spec sheet of your probe you can try and setup a custom probe and provide
            the values. Not all probes will work so YMMV. Built-in types are grilleye_iris,
            ikea_fantast, maverick_et733 and weber_igrill; any other value (for example custom) is a
            custom probe and needs reference_kohm and reference_beta above 0.
          example: grilleye_iris
          default: grilleye_iris
          examples:
            - custom
            - grilleye_iris
            - ikea_fantast
            - maverick_et733
            - weber_igrill
        reference_kohm:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 100000
          example: 100
          default: 100
          description: The reference resistance value from the spec sheet in kOhm - only used with type CUSTOM
        reference_celcius:
          type:
            - "integer"
            - "null"
          minimum: -100
          maximum: 500
          example: 25
          default: 25
          description: The reference celcius value from the spec sheet - only used with type CUSTOM
        reference_beta:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 100000
          examples:
            - 4250
            - null
          default: 4250
          description: The reference beta coefficient value from the spec sheet - only used with type CUSTOM
        type_icon:
          $ref: '#/components/schemas/TypeIcon'
        rest_minutes:
          type: integer
          minimum: 0
          maximum: 180
          example: 60
          default: 0
          description: >-
            In target mode, a timer "Rest: <name>" this long starts when the probe reaches its target, so you
            know when to slice. 0 is off. Not used in range mode.
        steps:
          type: array
          maxItems: 3
          description: >-
            In target mode, moments before the target: each fires once when the temperature climbs through
            it (a short beep, a page on the grill's screen) and stays done until the target or the steps
            change or the probe is plugged in again. Steps already passed at that moment are done without
            firing. Sending steps replaces them all, [] clears them. Each temperature is checked against the
            target when saving; a step the target later drops below is kept but ignored, and may be sent
            back at the same temperature (so it doesn't block changes to the other steps). Sorted by
            temperature, in the grill's unit (not converted when the unit changes, like the target).
          items:
            type: object
            required: [action, temperature]
            properties:
              action:
                type: string
                minLength: 1
                maxLength: 16
                example: Wrap
                description: 1 to 16 bytes, no control characters, "|" or ":".
              temperature:
                type: integer
                minimum: 1
                example: 74
                description: Whole degrees, below target_temperature.
              done:
                type: boolean
                readOnly: true
              ignored:
                type: boolean
                readOnly: true
                description: Not below the target, so it never fires.
        step_alert:
          type: integer
          readOnly: true
          example: -1
          description: Index of the step that fired in the last 15 minutes, -1 for none.
        offset_celcius:
          type:
            - "number"
            - "null"
          format: float
          example: 1.5
          default: 0
          minimum: -10.0
          maximum: 10.0
          description: User calibration offset in Celcius, added to a valid reading before it is converted to the settings' temperature unit.
        eta_seconds:
          type: integer
          readOnly: true
          description: >-
            Seconds until the target temperature at the current rate. -1 when unknown: not in
            target mode, not rising by at least 0.05 °C per minute, less than 3 minutes of
            readings, target reached, or more than 24 hours away.
        stalled:
          type: boolean
          readOnly: true
          description: >-
            In target mode, true while the probe is in the stall: the last 20 minutes stayed
            within 1.5 °C, between 60 and 80 °C, with the target at least 5 °C higher.
        lid_open:
          type: boolean
          readOnly: true
          description: >-
            In range mode, true after a sharp drop (8 °C within a minute, like opening the lid)
            until the temperature is back within 2 °C or lid_pause_minutes are over. The "too
            low" alarm waits meanwhile.

    History:
      type: object
      properties:
        probes:
          type: array
          description: One entry per connected probe (empty when the requested probe isn't connected).
          items:
            type: object
            properties:
              probe_id:
                type: integer
                description: The number of the probe
              coarse:
                $ref: '#/components/schemas/HistoryTier'
              fine:
                allOf:
                  - $ref: '#/components/schemas/HistoryTier'
                description: Only present when the request has a `probe` query parameter.
      example:
        probes:
          - probe_id: 1
            coarse:
              interval: 60
              age: 35
              values: [712, 715, null, 720]
            fine:
              interval: 10
              age: 3
              values: [718, 719, 720]

    HistoryTier:
      type: object
      properties:
        interval:
          type: integer
          description: Seconds between values
        age:
          type: integer
          description: >-
            Seconds since the newest value was taken. 0 when `values` is empty. Value i was taken
            `age + (n-1-i) * interval` seconds ago, where n is the number of values.
        values:
          type: array
          description: Tenths of a degree Celsius, oldest first. `null` marks a gap where the probe was unplugged.
          items:
            type:
              - integer
              - "null"

    Wifinetwork:
      type: object
      properties:
        ssid:
          type: string
          example: MyHomeWifi
          description: Wifi SSID
        signal_strength:
          type: integer
          example: -61
          description: The wifi signal expressed in dbm. The closer to 0 the better.
        auth_method:
          type: string
          description: The authentication method that is used by the wifi network
          example: wpa2_psk
          enum:
            - open
            - wep
            - wpa_psk
            - wpa2_psk
            - wpa_wpa2_psk
            - wpa2_enterprise
            - wpa3_psk
            - wpa2_wpa3_psk
            - wpapi_psk
            - unknown

    Presets:
      type: object
      properties:
        presets:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name, c, f]
            properties:
              name:
                type: string
                maxLength: 24
                example: Brisket flat
                description: Shown in the Food list, and the probe's name when it hasn't got one of its own.
              group:
                type: string
                maxLength: 20
                example: BBQ
                description: The Food list group, "My presets" when left out.
              type:
                $ref: '#/components/schemas/TypeIcon'
              c:
                type: number
                minimum: 1
                maximum: 300
                example: 93
                description: Target in °C (the maximum for a range).
              f:
                type: number
                minimum: 34
                maximum: 572
                example: 200
                description: Target in °F, its own value so both units get round numbers.
              min_c:
                type: number
                example: 107
                description: With min_f, makes it a range preset. 1 to c - 0.5; 0 or left out means no range.
              min_f:
                type: number
                example: 225
                description: With min_c, makes it a range preset. 33 to f - 0.5; 0 or left out means no range.
              rest:
                type: integer
                minimum: 0
                maximum: 180
                example: 60
                description: Minutes of rest after the target, sets the probe's rest_minutes. Left out for 0 and for a range.
              steps:
                type: array
                maxItems: 3
                description: >-
                  Moments before the target, set as the probe's steps when the preset is picked. Sorted by c;
                  left out when empty and dropped for a range.
                items:
                  type: object
                  required: [action, c, f]
                  properties:
                    action:
                      type: string
                      minLength: 1
                      maxLength: 16
                      example: Wrap
                      description: 1 to 16 bytes, no control characters, "|" or ":".
                    c:
                      type: integer
                      example: 74
                      description: Whole degrees, 1 to below the preset's c.
                    f:
                      type: integer
                      example: 165
                      description: Whole degrees, 1 to below the preset's f.
        hidden:
          type: array
          maxItems: 30
          items:
            type: string
            pattern: "^[a-z0-9-]{1,24}$"
          example: ["brisket", "salmon-glassy"]
          description: >-
            Ids of built-in presets that don't show in the Food list: the label in lower case with
            dashes.

    TypeIcon:
      type: string
      enum: ["", beef, lamb, pork, poultry, fish, sausage, vegetables, pit, other]
      default: ""
      example: beef
      description: >-
        The food type, shown as an icon on the probe's card and on the grill's screen. "" = no icon.
        Saved per socket, like the name.

    NotifyService:
      type: object
      properties:
        set_up:
          type: boolean
          description: >-
            Telegram has a bot token and a chat ID, ntfy a topic URL, Pushover a user key and an app
            token, the webhook a URL
          example: true
        last:
          type: object
          nullable: true
          description: The last message to this service since the grill started, null when none was sent
          properties:
            ok:
              type: boolean
              example: false
            error:
              type: string
              description: Why it wasn't sent, "" when it was
              example: "Telegram: Unauthorized, check the bot token"
            seconds_ago:
              type: integer
              example: 12
            test:
              type: boolean
              description: It was a test message from POST /notify/test
              example: true
    Settings:
      type: object
      properties:
        name:
          type: string
          example: Grilly+
          description: The chosen grill name
        uuid:
          type: string
          format: uuid
          example: 12abc3de-4567-89f0-a123-456b789012c3
          description: The unique id in UUIDv4 format (the same value as unique_id in GET /grill)
          readOnly: true
        firmware_version:
          type: string
          example: 25.03.01
          description: The current firmware version in CalVer
          readOnly: true
        temperature_unit:
          type: string
          description: The temperature_unit that is used
          example: celcius
          default: celcius
          enum:
            - celcius
            - fahrenheit
        beep_enabled:
          type: boolean
          example: true
          description: Is the buzzer enabled
        beep_on_ready:
          type: boolean
          example: true
          description: Beep when the target_temperature is reached
        beep_outside_target:
          type: boolean
          example: true
          description: Beep when a probe is outside of a temperature range
        cucaracha_enabled:
          type: boolean
          example: false
          description: Play La Cucaracha instead of plain beeps when a probe reaches its target
        beep_volume:
          type: integer
          example: 5
          minimum: 0
          maximum: 5
          description: The beeper volume from 0-5
        beep_degrees_before:
          type: integer
          example: 5
          minimum: 0
          maximum: 100
          description: Beep when the probe reaches this amount of degrees before the target temperature
        beep_at_step:
          type: boolean
          example: true
          description: Beep (like the early warning) when a probe reaches one of its steps.
        lid_pause_minutes:
          type: integer
          example: 5
          description: >-
            Range mode: after a sharp drop (lid opened) the "too low" alarm waits this many minutes for
            the temperature to come back. 0 to 30, 0 turns it off. With it on, "too low" also needs to
            last 30 seconds before it beeps.
        telegram_token:
          type: string
          writeOnly: true
          example: "123456789:AAE..."
          description: >-
            Token of the Telegram bot that sends the notifications (from @BotFather). Write-only, never
            returned. Leave it out to keep the saved token, send "" to remove it and stop notifications.
        telegram_token_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a Telegram bot token is saved.
        telegram_chat_id:
          type: string
          example: "123456789"
          description: >-
            The chat the bot sends to: your user ID, a group ID (starts with -) or @channelname.
            Notifications are only sent with both a token and a chat ID.
        ntfy_url:
          type: string
          writeOnly: true
          example: "https://ntfy.sh/my-grill-8f3k2"
          description: >-
            ntfy topic URL: http(s)://server/topic, the topic made of letters, digits, - and _ (at most
            64), without user:password@. http:// is for an ntfy server on the home network. "" switches
            ntfy off. Write-only: on ntfy.sh anyone who knows the topic can read the messages, so only
            ntfy_url_set and ntfy_server are returned.
        ntfy_url_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether an ntfy topic URL is saved.
        ntfy_server:
          type: string
          readOnly: true
          example: "https://ntfy.sh"
          description: The server part of the saved topic URL, "" when none is saved.
        ntfy_token:
          type: string
          writeOnly: true
          example: "tk_..."
          description: >-
            Optional ntfy access token, sent as a Bearer token. Write-only, never returned. Leave it out
            to keep the saved token, send "" to remove it. The token is tied to the server of ntfy_url:
            changing the URL to another server (or from https to http) without sending a new token
            removes the saved one, so it can't be redirected elsewhere.
        ntfy_token_set:
          type: boolean
          readOnly: true
          example: false
          description: Whether an ntfy access token is saved.
        pushover_user:
          type: string
          writeOnly: true
          example: "uQiRzpo4DXghDmr9QzzfQu27cmVRsG"
          description: Pushover user or group key. Write-only, never returned. "" removes it.
        pushover_user_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a Pushover user key is saved.
        pushover_token:
          type: string
          writeOnly: true
          example: "azGDORePK8gMaC0QOYAMyEEuzJnyUi"
          description: Pushover application API token. Write-only, never returned. "" removes it.
        pushover_token_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a Pushover app token is saved.
        webhook_url:
          type: string
          writeOnly: true
          example: "https://homeassistant.local:8123/api/webhook/grill-8f3k2"
          description: >-
            Gets a JSON POST for every notification: http(s)://host/anything without spaces or
            user:password@, at most 400 characters. Any 2xx answer counts as delivered. "" switches the
            webhook off. Write-only, because the URL often holds a secret id, so only webhook_url_set and
            webhook_server are returned. The body is
            {"event", "grill", "message", "unit", "probe": {"id", "name", "temperature", "target",
            "minimum"}, "battery", "timer": {"name", "probe"}, "step": {"action", "temperature"}}, with
            event one of ready, almost_ready, too_hot, too_cold, stall, battery_low, timer_done, step or
            test; probe is only there for a probe event or a step, battery only for battery_low, timer
            only for timer_done (its probe is 1-8 for a rest timer, else 0), step only for step (the
            probe's temperature is then the reading, the step's temperature the step).
        webhook_url_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a webhook URL is saved.
        webhook_server:
          type: string
          readOnly: true
          example: "https://homeassistant.local:8123"
          description: The scheme and host of the saved webhook URL, "" when none is saved.
        notify_ready:
          type: boolean
          example: true
          description: Notify when a probe in target mode reaches its target.
        notify_almost:
          type: boolean
          example: true
          description: Notify when a probe is beep_degrees_before from its target (off when that is 0).
        notify_outside:
          type: boolean
          example: true
          description: >-
            Notify when a probe in range mode goes above the maximum or below the minimum. Below the
            minimum waits for the lid like the beeper does (lid_pause_minutes).
        notify_stall:
          type: boolean
          example: true
          description: Notify when a probe goes into the stall (see stalled).
        notify_step:
          type: boolean
          example: true
          description: Notify when a probe reaches one of its steps, one message per step.
        notify_battery:
          type: boolean
          example: true
          description: Notify when the battery drops to 20 % and to 10 % while not charging.
        notify_timer:
          type: boolean
          example: true
          description: Notify when a timer runs out, a rest timer included.
        screen_timeout_minutes:
          type: integer
          example: 0
          minimum: 0
          maximum: 10000
          description: How many minutes before the screen turns off automatically. 0 disables the timeout.
        backlight_timeout_minutes:
          type: integer
          example: 0
          minimum: 0
          maximum: 10000
          description: How many minutes before the backlight turns off automatically. 0 disables the timeout.
        backlight_brightness:
          type: integer
          description: Screen backlight brightness setting (0-5)
          example: 5
          default: 5
          minimum: 0
          maximum: 5
        opengrill_server:
          type: string
          example: "opengrill.test.com"
        mqtt_broker:
          type: string
          example: "broker.test.com"
        mqtt_port:
          type: integer
          example: 1883
          minimum: 1
          maximum: 65535
        mqtt_topic:
          type: string
          example: "grilly-plus"
        mqtt_user:
          type: string
          example: ""
        mqtt_password:
          type: string
          writeOnly: true
          example: "********"
          description: The mqtt password. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        mqtt_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a mqtt password is saved.
        mqtt_ha_discovery:
          type: boolean
          example: true
          description: >-
            Announce the grill to Home Assistant through MQTT discovery (homeassistant/... topics), so
            it shows up as a device. Off removes the device again. See docs/mqtt.md.
        wifi_ssid:
          type: string
          example: my-home-wifi
          description: The name of the wifi network that the grill is connected to
        wifi_password:
          type: string
          writeOnly: true
          example: "********"
          description: The wifi password. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        wifi_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a wifi password is saved.
        wifi_ip:
          type: string
          example: 192.168.0.10
          description: The wifi ip when connected to your network
        wifi_subnet:
          type: string
          example: 255.255.255.0
          description: The wifi subnet
        wifi_gateway:
          type: string
          example: 192.168.0.1
          description: The wifi gateway
        wifi_dns:
          type: string
          example: 9.9.9.9
          description: The wifi dns
        local_ap_ssid:
          type: string
          example: GrillyPlus
          description: The name of the grill's local wifi network
        local_ap_password:
          type: string
          writeOnly: true
          example: "********"
          description: The local wifi password, empty or at least 8 characters. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        local_ap_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a local wifi password is saved.
        admin_password:
          type: string
          writeOnly: true
          example: "********"
          description: Password for firmware updates on /api/update (username admin). Firmware updates are open to anyone while it is empty. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it. While one is set, changing or removing it needs the current one as HTTP Basic auth (username admin), otherwise the whole request is rejected with 401. It can't be changed over MQTT.
        admin_password_set:
          type: boolean
          readOnly: true
          example: false
          description: Whether an admin password is saved.
        local_ap_ip:
          type: string
          example: 192.168.200.10
          description: The local wifi ip
        local_ap_subnet:
          type: string
          example: 255.255.255.0
          description: The local wifi subnet
        local_ap_gateway:
          type: string
          example: 192.168.200.1
          description: The local wifi gateway

paths:
  /grill:
    get:
      tags:
        - grill
      summary: Current grill info and probes
      description: >
        Get the current needed basic grill information + all the probes and
        their temperatures
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grill'

  /probes:
    get:
      tags:
        - probes
      summary: Probes
      description: >
        View current probe settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 8
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
    post:
      tags:
        - probes
      summary: Probes
      description: >
        Edit probes, you are not required to send all probes. Just send a list of probes that you have modified.
      requestBody:
        required: true
        description: Settings to set
        content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 8
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
        '400':
          $ref: '#/components/responses/400'
        '415':
          $ref: '#/components/responses/415'

  /settings:
    get:
      tags:
        - settings
      summary: Grill settings
      description: >
        Endpoint to view current settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    post:
      tags:
        - settings
      summary: Grill settings
      description: >
        Endpoint to edit settings. Changing or removing a set `admin_password` needs the current
        admin password as HTTP Basic auth with username `admin`.
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        description: Settings to set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          description: The body changes admin_password while one is set, without the current one as Basic auth. Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The current admin password is needed to change it"
        '415':
          $ref: '#/components/responses/415'

  /info:
    get:
      tags:
        - utility
      summary: What this firmware is and which features it has
      description: >
        For apps and integrations. `capabilities` lists features added on top of Free-Grilly; check for
        a name before using the feature, missing names mean an older firmware. `api_version` is raised
        only when an existing endpoint changes in an incompatible way.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  firmware:
                    type: string
                    example: grilly-plus
                  firmware_version:
                    type: string
                    example: "26.09.28.1"
                  api_version:
                    type: integer
                    example: 1
                  unique_id:
                    type: string
                    example: abac5767-4957-435a-aed6-4a94bae88716
                  hostname:
                    type: string
                    example: grilly-plus-abac5767.local
                  probe_count:
                    type: integer
                    example: 8
                  capabilities:
                    type: array
                    items:
                      type: string
                      enum: [history, eta, clear_history, alarm_mute, alarm_probes, calibration_offset, diagnostics, ota_upload, github_update, admin_reset, timers, steps]
                    description: >
                      history = GET /history; eta = eta_seconds per probe; clear_history = POST /history/clear and
                      MQTT config/clear_history; alarm_mute = POST /alarm/mute and MQTT config/mute; alarm_probes =
                      alarm per probe in /grill; calibration_offset = offset_celcius per probe; diagnostics = reset,
                      off reason and battery millivolts in /grill; ota_upload = POST /update; github_update = update_available
                      in /grill and the /update/latest, /update/check and /update/install endpoints;
                      admin_reset = POST /admin/reset/start, /admin/reset/cancel and /admin/reset;
                      timers = timers and alarm_timers in /grill, POST /timers and /timers/cancel;
                      steps = steps per probe in /probes, next_step and step_alert in /grill.

  /wifiscan:
    get:
      tags:
        - utility
      summary: Scan for wifi networks
      description: >
        Scans for nearby wifi networks, has a long latency of about 5-7 seconds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                items:
                  $ref: '#/components/schemas/Wifinetwork'

  /timers:
    post:
      tags:
        - grill
      summary: Start a timer
      description: >
        Starts a countdown on the grill. When it runs out the grill beeps like a probe alarm and shows
        TIME'S UP until it is muted. No admin auth is needed, like setting up probes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                name:
                  type: string
                  maxLength: 24
                  example: Flip the ribs
                  description: Empty or left out becomes "Timer"
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  example: 20
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timer'
        '400':
          description: Bad name or length
        '409':
          description: At most 6 timers

  /timers/cancel:
    post:
      tags:
        - grill
      summary: Stop a timer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  example: 3
      responses:
        '200':
          description: Stopped
        '404':
          description: No timer with that id

  /alarm/mute:
    post:
      tags:
        - grill
      summary: Mute a sounding alarm
      description: >
        Mutes a currently sounding alarm, the same as pressing the grill's button, and clears the
        timers that ran out. Harmless, so no admin auth is needed. It can take up to about 2 seconds for `alarm_sounding` to turn false.
      requestBody:
        required: false
        description: Body is ignored
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /time:
    post:
      tags:
        - grill
      summary: Give the grill the time
      description: >
        Sets the grill's clock, which tells a cook that carries on after a restart how long the grill
        was off. Only taken while `clock_known` is false (on the grill's hotspot, without internet),
        so no admin auth is needed. The web app sends it once when it opens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - epoch
              properties:
                epoch:
                  type: integer
                  example: 1795400000
                  description: Seconds since 1970 (UTC), after November 2023
      responses:
        '200':
          description: The clock is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: No valid epoch in the body
        '409':
          description: The grill already knows the time
        '415':
          description: Content-Type was not application/json

  /presets:
    get:
      tags:
        - settings
      summary: Your own food presets and the hidden built-in ones
      description: >
        Kept on the grill, so every phone and browser shows the same Food list. The built-in presets
        live in the web app; hidden holds the ids of the ones switched off.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presets'
    post:
      tags:
        - settings
      summary: Replace your own presets and/or the hidden list
      description: >
        Send presets, hidden or both; each list sent replaces the stored one. Checked as a whole: one
        bad preset and nothing is stored. Answers with the stored lists, like GET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Presets'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presets'
        '400':
          description: A preset or id isn't valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "c should be 1 to 300 and f 34 to 572 (preset 2)"
        '413':
          description: More than fits in the grill's storage (about 3000 bytes of presets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Too much to store, remove a few presets"
        '415':
          $ref: '#/components/responses/415'
        '500':
          description: The grill couldn't write the presets to its storage
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Couldn't store the presets"

  /notify:
    get:
      tags:
        - utility
      summary: Per service, whether it is set up and how the last message went
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sending:
                    type: boolean
                    description: Messages are queued or being sent (with retries, up to a few minutes)
                    example: false
                  telegram:
                    $ref: '#/components/schemas/NotifyService'
                  ntfy:
                    $ref: '#/components/schemas/NotifyService'
                  pushover:
                    $ref: '#/components/schemas/NotifyService'
                  webhook:
                    $ref: '#/components/schemas/NotifyService'

  /notify/test:
    post:
      tags:
        - utility
      summary: Send a test notification
      description: >
        Queues a test message to every service that is set up, read the result with GET /notify. Needs
        no admin auth: it only goes where the owner set it up, and it is allowed once every 10 seconds.
      requestBody:
        required: true
        description: Empty body
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: No service is set up
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No notifications are set up yet: save a service first"
        '409':
          description: The grill isn't connected to WiFi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The grill isn't connected to WiFi"
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"
        '429':
          description: A test was sent less than 10 seconds ago
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Sent a test less than 10 seconds ago"

  /update/latest:
    get:
      tags:
        - utility
      summary: Newest GitHub release and the state of the update check
      description: >
        The result of the last check for a newer release on GitHub. Start a check with POST /update/check.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: string
                    example: "26.09.28.2"
                  latest:
                    type: string
                    example: "26.10.03"
                    description: Newest release version, empty when no check has succeeded yet.
                  available:
                    type: boolean
                    example: true
                    description: True when latest is newer than current.
                  checked_seconds_ago:
                    type: integer
                    example: 1234
                    description: Seconds since the last successful check, -1 before the first one.
                  state:
                    type: string
                    enum: [idle, checking, error]
                    example: idle
                    description: What the updater is doing.
                  error:
                    type: string
                    example: ""
                    description: Why the last check failed, empty when it worked.
                  size:
                    type: integer
                    example: 1262368
                    description: Size of the firmware file in bytes.
                  last_install_error:
                    type: string
                    example: ""
                    description: Why the last install attempt failed, empty when there was none.

  /update/check:
    post:
      tags:
        - utility
      summary: Check GitHub for a newer release now
      description: >
        Starts a check in the background, read the result with GET /update/latest. Allowed once a minute.
        Needs no admin auth, it only reads from GitHub.
      requestBody:
        required: true
        description: Empty body
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"
        '409':
          description: The grill isn't connected to WiFi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The grill isn't connected to WiFi"
        '429':
          description: Checked less than a minute ago
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Checked less than a minute ago"

  /update/install:
    post:
      tags:
        - utility
      summary: Install a GitHub release
      description: >
        Downloads and installs the given release. The grill answers 202 and restarts into an update mode,
        which keeps its web server and MQTT off until the update is done or has failed, so expect it to
        be unreachable for a few minutes. Needs the admin password as basic auth (user admin) when one
        is set. The password is checked before the body, so a wrong password answers 401 even when the
        body is invalid too.
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  example: "26.10.03"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Body was not json or has no version
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Body should be json with a version"
        '401':
          description: Wrong admin password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wrong admin password"
        '409':
          description: Not the offered version, or no WiFi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - "That version isn't on offer, check for updates again"
                      - "The grill isn't connected to WiFi"
        '412':
          description: Battery below 30 % and not charging
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Charge the grill first (at least 30 %)"
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /admin/reset/start:
    post:
      tags:
        - utility
      summary: Show a code for resetting a forgotten admin password
      description: >
        Shows a 6-digit code on the grill's own screen for 5 minutes (and beeps once), so only someone
        at the grill can reset the admin password with POST /admin/reset. Asking again while a code is
        valid keeps the same code; a new code can be asked for a minute after the previous one. After 15
        wrong codes in total, no new code is given until the grill restarts. Needs the json
        content type (no admin password). Not available over MQTT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: The code is on the grill's screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  seconds_left:
                    type: integer
                    example: 300
        '409':
          description: No admin password is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No admin password is set"
        '415':
          description: Not sent as application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"
        '423':
          description: 15 wrong codes since the grill started; restart it to try again
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Too many wrong codes. Restart the grill to try again"
        '429':
          description: A new code was asked for within a minute of the previous one
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wait a minute before asking for a new code"

  /admin/reset/cancel:
    post:
      tags:
        - utility
      summary: Take the password reset code off the grill's screen
      description: >
        Ends the current code, like a short press on the grill's button. Always answers 200, also when
        no code was showing. Needs the json content type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: No code is showing anymore
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '415':
          $ref: '#/components/responses/415'

  /admin/reset:
    post:
      tags:
        - utility
      summary: Reset the admin password with the code from the grill's screen
      description: >
        Replaces the admin password with admin_password, or removes it when admin_password is empty or
        left out. Every other setting stays. A code works once; 5 wrong codes end it and a new one is
        needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "042917"
                admin_password:
                  type: string
                  maxLength: 64
                  description: The new admin password; empty or left out removes it
      responses:
        '200':
          description: The admin password was replaced or removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Body was not json, has no code, or the password is too long
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Body should be json with the code"
        '403':
          description: Wrong code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wrong code"
                  attempts_left:
                    type: integer
                    description: Tries left for this code; 0 means it has ended
                    example: 4
        '410':
          description: "No valid code: never asked for, expired, used, or ended after 5 wrong tries"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The code is no longer valid, ask for a new one"
        '415':
          $ref: '#/components/responses/415'

  /history:
    get:
      tags:
        - probes
      summary: Temperature history
      description: >
        Temperature history for every connected probe (coarse tier only), or for one probe (coarse
        and fine tiers) when `probe` is given.
      parameters:
        - name: probe
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
          description: Limit the response to one probe and include its fine tier.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: probe was outside 1-8
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "probe should be 1 to 8"

  /history/clear:
    post:
      tags:
        - probes
      summary: Clear a probe's history
      description: >
        Clears the temperature history of one probe (the graph and time-to-target start over).
        Harmless, so no admin auth is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                probe_id:
                  type: integer
                  minimum: 1
                  maximum: 8
              example:
                probe_id: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Empty or malformatted body, or probe_id outside 1-8
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "probe_id should be between 1 and 8"
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /update:
    post:
      tags:
        - utility
      summary: Install a firmware update
      description: >
        Uploads an `-ota.bin` firmware file as `multipart/form-data` and installs it. The request
        must include the `X-Grilly-Update: 1` header (this also forces a CORS preflight, so a page
        on another site can't trigger an update). When an admin password is set, send it as HTTP
        Basic auth with username `admin`. On success the grill restarts about 1 second later.
      parameters:
        - name: X-Grilly-Update
          in: header
          required: true
          schema:
            type: string
            enum: ["1"]
          description: Must be "1". Without it the request is rejected before any auth check.
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        description: The firmware file, in any form field (the web app uses `firmware`)
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK, the grill restarts shortly after this response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: The upload was empty, interrupted, not a valid OTA image, or failed to write
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This is not an OTA firmware file. Use the -ota.bin file."
        '401':
          description: An admin password is set and was missing or wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wrong admin password"
        '403':
          description: The X-Grilly-Update header was missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing X-Grilly-Update header"
