openapi: '3.1.1'
info:
  title: Grilly+
  version: '25.3.27'
  description: The local Grilly+ api

externalDocs:
  url: https://github.com/bardesss/grilly-plus
  description: Git repository

servers:
  - url: http://{grilly-plus-ip}/api
    variables:
      grilly-plus-ip:
        default: 192.168.200.10
        description: Your Grilly+ ip address

tags:
  - name: grill
    description: Grill overview with current status and temperatures
  - name: probes
    description: Detailed probe data and settings
  - name: settings
    description: Settings management
  - name: utility
    description: Utility api calls

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username "admin" with the configured admin_password. Only checked when an admin password is set.
  responses:
    '400':
      description: Malformatted body
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                default: "malformatted body"
                enum:
                  - malformatted body
                  - empty body
  schemas:
    Grill:
      type: object
      properties:
        name:
          type: string
          example: Grilly+
          description: The chosen grill name
        unique_id:
          type: string
          format: uuid
          example: 12abc3de-4567-89f0-a123-456b789012c3
          description: The unique id in UUIDv4 format
        firmware_version:
          type: string
          example: 25.03.01
          description: The current firmware version in CalVer
        hostname:
          type: string
          example: grilly-plus-43c62ed2.local
          description: >-
            The grill's mDNS address, reachable from apps and browsers that support .local names.
            Built from the first 8 hex characters of unique_id and fixed for the life of the device.
        battery_percentage:
          type: integer
          example: 95
          description: The current - estimated - battery %
        battery_charging:
          type: boolean
          example: true
          description: If the battery is charging
        battery_millivolts:
          type: integer
          example: 3950
          description: The battery cell voltage in millivolts. 0 when the fuel gauge could not be read.
        last_reset_reason:
          type: string
          example: software
          description: >-
            Why the device last (re)started, read from esp_reset_reason() once at boot.
          enum:
            - power_on
            - software
            - panic
            - interrupt_watchdog
            - task_watchdog
            - watchdog
            - deep_sleep_wake
            - brownout
            - external
            - unknown
        last_off_reason:
          type: string
          example: update
          description: >-
            Why the device was last switched off or restarted deliberately, persisted across the
            power-off. Empty string when unknown, for example after the very first boot.
          enum:
            - button
            - factory_reset
            - update
            - low_battery
            - ""
        wifi_connected:
          type: boolean
          example: true
          description: If the grill is connected to a wifi network
        wifi_ssid:
          type: string
          example: my-home-wifi
          description: The name of the wifi network that the grill is connected to
        wifi_signal:
          type: integer
          example: -61
          description: The wifi signal expressed in dbm. The closer to 0 the better.
        wifi_ip:
          type: string
          example: 192.168.0.10
          description: The wifi ip when connected to your network
        local_ap_ssid:
          type: string
          example: GrillyPlus_A1B2C3
          description: The name of the grill's own hotspot, which is always on
        local_ap_ip:
          type: string
          example: 192.168.200.10
          description: The grill's address on its own hotspot
        temperature_unit:
          type: string
          description: The temperature_unit that is used
          example: celcius
          default: celcius
          enum:
            - celcius
            - fahrenheit
        alarm_sounding:
          type: boolean
          example: false
          description: True while a probe alarm is actively beeping. Mute it with POST /alarm/mute or over MQTT.
        update_available:
          type: string
          example: ""
          description: Version of a newer GitHub release found by the last update check, empty when there is none. See GET /update/latest.
        probes:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            properties:
              probe_id:
                type: integer
                description: The number of the probe
              name:
                type: string
                example: Probe 1
                description: The probe name
              temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The temperature in Celcius/Fahrenheit
              minimum_temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The minimum temperature in Celcius/Fahrenheit according to the settings. Used for temperature ranges. Above 0 the probe is in range mode and alarms when the temperature leaves minimum..target. 0 or below means target mode, which alarms once when the target is reached.
                examples:
                  - 30.00
                  - 25.5
              target_temperature:
                type:
                  - "number"
                  - "null"
                format: float
                description: The target temperature in Celcius/Fahrenheit
                examples:
                  - 30.00
                  - 25.5
              connected:
                type: boolean
                description: Is the probe connected
              connected_seconds:
                type: integer
                description: Seconds since the probe was connected, 0 when it is not connected
              alarm:
                type: boolean
                description: True while this probe is one of the causes of a sounding alarm_sounding
              eta_seconds:
                type: integer
                readOnly: true
                description: >-
                  Seconds until the target temperature at the current rate. -1 when unknown: not in
                  target mode, not rising by at least 0.05 °C per minute, less than 3 minutes of
                  readings, target reached, or more than 24 hours away.
            example:
              probe_id: 1
              name: Ambient Probe
              temperature: 23.71832
              minimum_temperature: null
              target_temperature: 23.71832
              connected: true
              eta_seconds: -1

    Probe:
      type: object
      properties:
        probe_id:
          type: integer
          description: The number of the probe
          examples:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
        name:
          type: string
          examples:
            - Probe 1
            - Ambient Probe
            - Pork shoulder
          description: The probe name
        temperature:
          type:
            - "number"
            - "null"
          format: float
          readOnly: true
          description: The temperature in Celcius/Fahrenheit according to the settings.
          examples:
            - 25.101
            - 27.101
            - 150.33
        minimum_temperature:
          type:
            - "number"
            - "null"
          format: float
          description: The minimum temperature in Celcius/Fahrenheit according to the settings. Used for temperature ranges. Above 0 the probe is in range mode and alarms when the temperature leaves minimum..target. 0 or below means target mode, which alarms once when the target is reached.
          default: 0
          examples:
            - 25.50
            - 120
        target_temperature:
          type:
            - "number"
            - "null"
          format: float
          description: The target temperature in Celcius/Fahrenheit according to the settings.
          default: 0
          examples:
            - 25.50
            - 120
        connected:
          type: boolean
          description: Is the probe connected
          readOnly: true
        probe_type:
          type: string
          description: >
            The probe type connected to the grilleye. There are several built-in probe types. If
            you have the spec sheet of your probe you can try and setup a custom probe and provide
            the values. Not all probes will work so YMMV.
          example: grilleye_iris
          default: grilleye_iris
          enum:
            - custom
            - grilleye_iris
            - ikea_fantast
            - maverick_et733
            - weber_igrill
        reference_kohm:
          type:
            - "number"
            - "null"
          format: float
          example: 100
          default: 100
          description: The reference resistance value from the spec sheet in kOhm - only used with type CUSTOM
        reference_celcius:
          type:
            - "number"
            - "null"
          format: float
          example: 25
          default: 25
          description: The reference celcius value from the spec sheet - only used with type CUSTOM
        reference_beta:
          type:
            - "number"
            - "null"
          format: float
          examples:
            - 4250
            - null
          default: 4250
          description: The reference beta coefficient value from the spec sheet - only used with type CUSTOM
        offset_celcius:
          type:
            - "number"
            - "null"
          format: float
          example: 1.5
          default: 0
          minimum: -10.0
          maximum: 10.0
          description: User calibration offset in Celcius, added to a valid reading before it is converted to the settings' temperature unit.
        eta_seconds:
          type: integer
          readOnly: true
          description: >-
            Seconds until the target temperature at the current rate. -1 when unknown: not in
            target mode, not rising by at least 0.05 °C per minute, less than 3 minutes of
            readings, target reached, or more than 24 hours away.

    History:
      type: object
      properties:
        probes:
          type: array
          description: One entry per connected probe (empty when the requested probe isn't connected).
          items:
            type: object
            properties:
              probe_id:
                type: integer
                description: The number of the probe
              coarse:
                $ref: '#/components/schemas/HistoryTier'
              fine:
                allOf:
                  - $ref: '#/components/schemas/HistoryTier'
                description: Only present when the request has a `probe` query parameter.
      example:
        probes:
          - probe_id: 1
            coarse:
              interval: 60
              age: 35
              values: [712, 715, null, 720]
            fine:
              interval: 10
              age: 3
              values: [718, 719, 720]

    HistoryTier:
      type: object
      properties:
        interval:
          type: integer
          description: Seconds between values
        age:
          type: integer
          description: >-
            Seconds since the newest value was taken. 0 when `values` is empty. Value i was taken
            `age + (n-1-i) * interval` seconds ago, where n is the number of values.
        values:
          type: array
          description: Tenths of a degree Celsius, oldest first. `null` marks a gap where the probe was unplugged.
          items:
            type:
              - integer
              - "null"

    Wifinetwork:
      type: object
      properties:
        ssid:
          type: string
          example: MyHomeWifi
          description: Wifi SSID
        signal_strength:
          type: integer
          example: -61
          description: The wifi signal expressed in dbm. The closer to 0 the better.
        auth_method:
          type: string
          description: The authentication method that is used by the wifi network
          example: wpa2_psk
          enum:
            - open
            - wep
            - wpa_psk
            - wpa2_psk
            - wpa_wpa2_psk
            - wpa2_enterprise
            - wpa3_psk
            - wpa2_wpa3_psk
            - wpapi_psk
            - unknown

    Settings:
      type: object
      properties:
        name:
          type: string
          example: Grilly+
          description: The chosen grill name
        unique_id:
          type: string
          format: uuid
          example: 12abc3de-4567-89f0-a123-456b789012c3
          description: The unique id in UUIDv4 format
          readOnly: true
        firmware_version:
          type: string
          example: 25.03.01
          description: The current firmware version in CalVer
          readOnly: true
        temperature_unit:
          type: string
          description: The temperature_unit that is used
          example: celcius
          default: celcius
          enum:
            - celcius
            - fahrenheit
        beep_enabled:
          type: boolean
          example: true
          description: Is the buzzer enabled
        beep_on_ready:
          type: boolean
          example: true
          description: Beep when the target_temperature is reached
        beep_outside_target:
          type: boolean
          example: true
          description: Beep when a probe is outside of a temperature range
        beep_volume:
          type: integer
          example: 5
          description: The beeper volume from 1-5
        beep_degrees_before:
          type: integer
          example: 5
          description: Beep when the probe reaches this amount of degrees before the target temperature
        screen_timeout_minutes:
          type: integer
          example: 0
          description: How many minutes before the screen turns off automatically. 0 disables the timeout.
        backlight_timeout_minutes:
          type: integer
          example: 0
          description: How many minutes before the backlight turns off automatically. 0 disables the timeout.
        backlight_brightness:
          type: integer
          description: Screen backlight brightness setting (0-5)
          example: 5
          default: 5
          minimum: 0
          maximum: 5
        opengrill_server:
          type: string
          example: "opengrill.test.com"
        mqtt_broker:
          type: string
          example: "broker.test.com"
        mqtt_port:
          type: integer
          example: 1883
        mqtt_topic:
          type: string
          example: "grilly-plus"
        mqtt_user:
          type: string
          example: ""
        mqtt_password:
          type: string
          writeOnly: true
          example: "********"
          description: The mqtt password. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        mqtt_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a mqtt password is saved.
        wifi_ssid:
          type: string
          example: my-home-wifi
          description: The name of the wifi network that the grill is connected to
        wifi_password:
          type: string
          writeOnly: true
          example: "********"
          description: The wifi password. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        wifi_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a wifi password is saved.
        wifi_ip:
          type: string
          example: 192.168.0.10
          description: The wifi ip when connected to your network
        wifi_subnet:
          type: string
          example: 255.255.255.0
          description: The wifi subnet
        wifi_gateway:
          type: string
          example: 192.168.0.1
          description: The wifi gateway
        wifi_dns:
          type: string
          example: 9.9.9.9
          description: The wifi dns
        local_ap_ssid:
          type: string
          example: GrillyPlus
          description: The name of the grill's local wifi network
        local_ap_password:
          type: string
          writeOnly: true
          example: "********"
          description: The local wifi password. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it.
        local_ap_password_set:
          type: boolean
          readOnly: true
          example: true
          description: Whether a local wifi password is saved.
        admin_password:
          type: string
          writeOnly: true
          example: "********"
          description: Password for firmware updates on /api/update (username admin). Firmware updates are open to anyone while it is empty. Write-only, never returned. Leave it out to keep the saved password, send "" to remove it. While one is set, changing or removing it needs the current one as HTTP Basic auth (username admin), otherwise the whole request is rejected with 401. It can't be changed over MQTT.
        admin_password_set:
          type: boolean
          readOnly: true
          example: false
          description: Whether an admin password is saved.
        local_ap_ip:
          type: string
          example: 192.168.200.10
          description: The local wifi ip
        local_ap_subnet:
          type: string
          example: 255.255.255.0
          description: The local wifi subnet
        local_ap_gateway:
          type: string
          example: 192.168.200.1
          description: The local wifi gateway

paths:
  /grill:
    get:
      tags:
        - grill
      summary: Current grill info and probes
      description: >
        Get the current needed basic grill information + all the probes and
        their temperatures
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grill'

  /probes:
    get:
      tags:
        - probes
      summary: Probes
      description: >
        View current probe settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 8
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
    post:
      tags:
        - probes
      summary: Probes
      description: >
        Edit probes, you are not required to send all probes. Just send a list of probes that you have modified.
      requestBody:
        required: true
        description: Settings to set
        content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 8
                maxItems: 8
                items:
                  $ref: '#/components/schemas/Probe'
        '400':
          $ref: '#/components/responses/400'

  /settings:
    get:
      tags:
        - settings
      summary: Grill settings
      description: >
        Endpoint to view current settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    post:
      tags:
        - settings
      summary: Grill settings
      description: >
        Endpoint to edit settings. Changing or removing a set `admin_password` needs the current
        admin password as HTTP Basic auth with username `admin`.
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        description: Settings to set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          description: The body changes admin_password while one is set, without the current one as Basic auth. Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The current admin password is needed to change it"

  /info:
    get:
      tags:
        - utility
      summary: What this firmware is and which features it has
      description: >
        For apps and integrations. `capabilities` lists features added on top of Free-Grilly; check for
        a name before using the feature, missing names mean an older firmware. `api_version` is raised
        only when an existing endpoint changes in an incompatible way.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  firmware:
                    type: string
                    example: grilly-plus
                  firmware_version:
                    type: string
                    example: "26.09.28.1"
                  api_version:
                    type: integer
                    example: 1
                  unique_id:
                    type: string
                    example: abac5767-4957-435a-aed6-4a94bae88716
                  hostname:
                    type: string
                    example: grilly-plus-abac5767.local
                  probe_count:
                    type: integer
                    example: 8
                  capabilities:
                    type: array
                    items:
                      type: string
                      enum: [history, eta, clear_history, alarm_mute, alarm_probes, calibration_offset, diagnostics, ota_upload, github_update]
                    description: >
                      history = GET /history; eta = eta_seconds per probe; clear_history = POST /history/clear and
                      MQTT config/clear_history; alarm_mute = POST /alarm/mute and MQTT config/mute; alarm_probes =
                      alarm per probe in /grill; calibration_offset = offset_celcius per probe; diagnostics = reset,
                      off reason and battery millivolts in /grill; ota_upload = POST /update; github_update = update_available
                      in /grill and the /update/latest, /update/check and /update/install endpoints.

  /wifiscan:
    get:
      tags:
        - utility
      summary: Scan for wifi networks
      description: >
        Scans for nearby wifi networks, has a long latency of about 5-7 seconds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                items:
                  $ref: '#/components/schemas/Wifinetwork'

  /alarm/mute:
    post:
      tags:
        - grill
      summary: Mute a sounding alarm
      description: >
        Mutes a currently sounding alarm, the same as pressing the grill's button. Harmless, so no
        admin auth is needed. It can take up to about 2 seconds for `alarm_sounding` to turn false.
      requestBody:
        required: false
        description: Body is ignored
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /update/latest:
    get:
      tags:
        - utility
      summary: Newest GitHub release and the state of the update check
      description: >
        The result of the last check for a newer release on GitHub. Start a check with POST /update/check.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: string
                    example: "26.09.28.2"
                  latest:
                    type: string
                    example: "26.10.03"
                    description: Newest release version, empty when no check has succeeded yet.
                  available:
                    type: boolean
                    example: true
                    description: True when latest is newer than current.
                  checked_seconds_ago:
                    type: integer
                    example: 1234
                    description: Seconds since the last successful check, -1 before the first one.
                  state:
                    type: string
                    enum: [idle, checking, error]
                    example: idle
                    description: What the updater is doing.
                  error:
                    type: string
                    example: ""
                    description: Why the last check failed, empty when it worked.
                  notes:
                    type: string
                    example: "Adds the update check"
                    description: Release notes of the latest release, cut off at 600 bytes.
                  size:
                    type: integer
                    example: 1262368
                    description: Size of the firmware file in bytes.
                  last_install_error:
                    type: string
                    example: ""
                    description: Why the last install attempt failed, empty when there was none.

  /update/check:
    post:
      tags:
        - utility
      summary: Check GitHub for a newer release now
      description: >
        Starts a check in the background, read the result with GET /update/latest. Allowed once a minute.
        Needs no admin auth, it only reads from GitHub.
      requestBody:
        required: true
        description: Empty body
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"
        '409':
          description: The grill isn't connected to WiFi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The grill isn't connected to WiFi"
        '429':
          description: Checked less than a minute ago
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Checked less than a minute ago"

  /update/install:
    post:
      tags:
        - utility
      summary: Install a GitHub release
      description: >
        Downloads and installs the given release. The grill answers 202 and restarts into an update mode,
        which keeps its web server and MQTT off until the update is done or has failed, so expect it to
        be unreachable for a few minutes. Needs the admin password as basic auth (user admin) when one
        is set.
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  example: "26.10.03"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Body was not json or has no version
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Body should be json with a version"
        '401':
          description: Wrong admin password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wrong admin password"
        '409':
          description: Not the offered version, or no WiFi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - "That version isn't on offer, check for updates again"
                      - "The grill isn't connected to WiFi"
        '412':
          description: Battery below 30 % and not charging
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Charge the grill first (at least 30 %)"
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /history:
    get:
      tags:
        - probes
      summary: Temperature history
      description: >
        Temperature history for every connected probe (coarse tier only), or for one probe (coarse
        and fine tiers) when `probe` is given.
      parameters:
        - name: probe
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
          description: Limit the response to one probe and include its fine tier.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: probe was outside 1-8
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "probe should be 1 to 8"

  /history/clear:
    post:
      tags:
        - probes
      summary: Clear a probe's history
      description: >
        Clears the temperature history of one probe (the graph and time-to-target start over).
        Harmless, so no admin auth is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                probe_id:
                  type: integer
                  minimum: 1
                  maximum: 8
              example:
                probe_id: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Malformatted body or probe_id outside 1-8
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "probe_id should be between 1 and 8"
        '415':
          description: Content-Type was not application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Content-Type should be application/json"

  /update:
    post:
      tags:
        - utility
      summary: Install a firmware update
      description: >
        Uploads an `-ota.bin` firmware file as `multipart/form-data` and installs it. The request
        must include the `X-Grilly-Update: 1` header (this also forces a CORS preflight, so a page
        on another site can't trigger an update). When an admin password is set, send it as HTTP
        Basic auth with username `admin`. On success the grill restarts about 1 second later.
      parameters:
        - name: X-Grilly-Update
          in: header
          required: true
          schema:
            type: string
            enum: ["1"]
          description: Must be "1". Without it the request is rejected before any auth check.
      security:
        - basicAuth: []
      requestBody:
        required: true
        description: The firmware file
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK, the grill restarts shortly after this response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: The upload was empty, interrupted, not a valid OTA image, or failed to write
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "This is not an OTA firmware file. Use the -ota.bin file."
        '401':
          description: An admin password is set and was missing or wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Wrong admin password"
        '403':
          description: The X-Grilly-Update header was missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing X-Grilly-Update header"
